name: Android 556MB real national Shortbread pack offline QA
on:
  push:
    branches: ['develop/phase0-android-maplibre']
    paths:
      - 'app/src/main/java/vn/navitaximap/MainActivity.kt'
      - 'ci/saf-picker-smoke.py'
      - 'ci/shortbread-national-emulator.sh'
      - '.github/workflows/android-shortbread-national.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  national-original-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate shell/Python and compile Android
        run: |
          bash -n ci/shortbread-national-emulator.sh
          bash -n ci/push-emulator-download.sh
          python3 -m py_compile ci/saf-picker-smoke.py
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Retrieve independently SHA-verified nationwide archive
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-Vietnam-Whole-Country-OSM-UNREVIEWED
          run-id: 43378133931
          github-token: ${{ github.token }}
          path: original-national
      - name: Locate nationwide original for SHA validation
        run: |
          FILE="$(find original-national -type f -name '00-viet-nam-all.pmtiles' -print -quit)"
          test -s "$FILE"
          echo "$FILE" > /tmp/navitaxi-national-file
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SAF stream SHA and airplane-mode real nationwide PMTiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/shortbread-national-emulator.sh app/build/outputs/apk/debug/app-debug.apk "$(cat /tmp/navitaxi-national-file)"
      - name: Preserve screenshots and hashes, NOT 556MB source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-National556MB-offline-emulator-evidence
          path: national-evidence
          retention-days: 14
          if-no-files-found: warn
