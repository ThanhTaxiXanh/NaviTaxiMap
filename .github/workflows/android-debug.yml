name: Android debug branch CI
on:
  push:
    branches:
      - 'develop/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate emulator smoke script syntax before building
        run: bash -n ci/smoke-emulator.sh
      - name: Test Android and assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify synthetic PMTiles v3 fixture
        run: python3 -m unittest discover -s tools/pmtiles_fixture/tests -v
      - name: Unit-test Vietnam map approval engine
        run: python3 -m unittest discover -s tools/vietnam-sovereignty-map/tests -v
      - name: Unit-test reproducible OSM to PMTiles generator
        run: python3 -m unittest discover -s tools/osm_hanoi_pilot/tests -v
      - name: Validate Android Shortbread pins and private preservation verifier (no Shapely pipeline dependency)
        run: |
          python3 -m unittest discover -s tools/vietnam34 -p 'test_android_shortbread.py' -v
          python3 -m unittest discover -s tools/vietnam34 -p 'test_preservation_receipt.py' -v
      - name: Verify real OSM Hanoi pilot source snapshot and bundled PMTiles bytes
        run: python3 tools/osm_hanoi_pilot/verify_embedded_pilot.py
      - name: Upload debug APK (not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Install and launch debug APK on emulator
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK produced by this workflow
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-debug
          path: smoke-apk
      - uses: android-actions/setup-android@v4
      - name: Allow KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, start and observe app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/smoke-emulator.sh smoke-apk/app-debug.apk
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-emulator-evidence
          path: smoke-evidence
          if-no-files-found: warn
          retention-days: 14
