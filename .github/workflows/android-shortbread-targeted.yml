name: Android remaining Hai Phong and Da Nang offline QA
on:
  push:
    branches: ['develop/phase0-android-maplibre']
    paths:
      - 'ci/shortbread-targeted-31-48.sh'
      - '.github/workflows/android-shortbread-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm-remaining-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate script before emulator and compile checked APK
        run: |
          bash -n ci/shortbread-targeted-31-48.sh
          bash -n ci/shortbread-coverage-one.sh
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Download original 34 independently SHA-verified provinces
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-34-Provinces-OSM-UNREVIEWED
          run-id: 43378133931
          github-token: ${{ github.token }}
          path: original-packs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exact-SHA SAF import and genuine offline pixels for codes 31 and 48
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/shortbread-targeted-31-48.sh app/build/outputs/apk/debug/app-debug.apk original-packs
      - name: Upload actual screenshot and validation logs, not region archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-HaiPhong-DaNang-offline-QA
          path: targeted-evidence
          retention-days: 14
          if-no-files-found: warn
