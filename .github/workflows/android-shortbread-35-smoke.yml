name: Android real Bắc Ninh Shortbread offline visual QA
on:
  push:
    branches: ['develop/phase0-android-maplibre']
    paths:
      - 'app/src/main/java/vn/navitaximap/MainActivity.kt'
      - 'app/src/main/java/vn/navitaximap/data/Vietnam35Catalog.kt'
      - 'app/src/main/assets/shortbread_offline_style.json'
      - 'ci/shortbread-emulator.sh'
      - 'ci/push-emulator-download.sh'
      - 'ci/check-shortbread-screenshot.py'
      - 'ci/saf-picker-smoke.py'
      - '.github/workflows/android-shortbread-35-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bac-ninh-real-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK and Android JUnit tests
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Retrieve existing independently verified province artifact
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-34-Provinces-OSM-UNREVIEWED
          run-id: 43378133931
          github-token: ${{ github.token }}
          path: original-packs
      - name: Prove exact real Bac Ninh archive
        run: |
          FILE="$(find original-packs -type f -name '24-bac-ninh.pmtiles' -print -quit)"
          test -n "$FILE"
          echo "6edc513adf8b8ad467982e818dc3450fcbbb14076ca2bf4bac352f1b9ca9ee7f  $FILE" | sha256sum -c -
          echo "$FILE" > /tmp/shortbread-bacninh-path
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android SAF import and airplane-mode Shortbread road pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/shortbread-emulator.sh app/build/outputs/apk/debug/app-debug.apk "$(cat /tmp/shortbread-bacninh-path)"
      - name: Publish test evidence (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-Shortbread-BacNinh-emulator-evidence
          path: shortbread-evidence
          retention-days: 14
          if-no-files-found: warn
