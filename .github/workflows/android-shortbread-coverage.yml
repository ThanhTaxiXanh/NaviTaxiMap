name: Android all 34 provincial real Shortbread offline coverage
on:
  push:
    branches: ['develop/phase0-android-maplibre']
    paths:
      - 'app/src/main/java/vn/navitaximap/MainActivity.kt'
      - 'ci/shortbread-coverage-one.sh'
      - 'ci/shortbread-coverage-shard.sh'
      - 'ci/saf-picker-smoke.py'
      - '.github/workflows/android-shortbread-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static shell and Python syntax gate before emulator
        run: |
          bash -n ci/shortbread-coverage-one.sh
          bash -n ci/shortbread-coverage-shard.sh
          bash -n ci/push-emulator-download.sh
          python3 -m py_compile ci/saf-picker-smoke.py
      - name: Build debug and run JVM checks
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Share exact tested APK with each shard
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-34QA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  verify-34-provinces:
    needs: compile-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Download the same APK compiled above
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-34QA-debug
          path: coverage-apk
      - name: Download real independently SHA-audited 34-province artifact
        uses: actions/download-artifact@v4
        with:
          name: NaviTaxiMap-34-Provinces-OSM-UNREVIEWED
          run-id: 43378133931
          github-token: ${{ github.token }}
          path: original-packs
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Independently verify and render each original province through SAF in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/shortbread-coverage-shard.sh coverage-apk/app-debug.apk original-packs ${{ matrix.shard }}
      - name: Preserve per-province screenshots, SHA and failures (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxiMap-34QA-shard-${{ matrix.shard }}
          path: coverage-evidence
          retention-days: 14
          if-no-files-found: warn
